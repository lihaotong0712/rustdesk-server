name: Sync Upstream and Build Docker Image

on:
  schedule:
    # 每周一 UTC 02:00 执行 (即北京时间10:00)
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force rebuild even if no upstream changes"
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  UPSTREAM_IMAGE: rustdesk/rustdesk-server-pro:latest
  RUST_TOOLCHAIN: 1.93.0
  CROSS_VERSION: 0.2.5

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    permissions:
      packages: read
    outputs:
      should_build: ${{ steps.compare.outputs.should_build }}
      upstream_digest: ${{ steps.upstream.outputs.digest }}
      current_digest: ${{ steps.current.outputs.digest }}

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get upstream image digest
        id: upstream
        run: |
          set -euo pipefail
          DIGEST=$(docker buildx imagetools inspect "${{ env.UPSTREAM_IMAGE }}" --format '{{json .Manifest}}' | jq -r '.digest // empty')
          if [[ -z "$DIGEST" || "$DIGEST" == "null" ]]; then
            echo "::error::Failed to get manifest-list digest for ${{ env.UPSTREAM_IMAGE }}"
            exit 1
          fi
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "Upstream digest: $DIGEST"

      - name: Get current base image digest
        id: current
        run: |
          set -euo pipefail
          # 尝试获取当前镜像的 label 中记录的上游 digest
          CURRENT_DIGEST=""
          if docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest 2>/dev/null; then
            CURRENT_DIGEST=$(docker inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest 2>/dev/null | jq -r '.[0].Config.Labels["upstream.digest"] // empty') || CURRENT_DIGEST=""
          fi
          echo "digest=$CURRENT_DIGEST" >> $GITHUB_OUTPUT
          if [[ -z "$CURRENT_DIGEST" ]]; then
            echo "Current recorded upstream digest: <none> (first build)"
          else
            echo "Current recorded upstream digest: $CURRENT_DIGEST"
          fi

      - name: Compare digests
        id: compare
        run: |
          set -euo pipefail
          UPSTREAM="${{ steps.upstream.outputs.digest }}"
          CURRENT="${{ steps.current.outputs.digest }}"
          FORCE="${{ github.event.inputs.force_build }}"

          echo "Upstream digest: $UPSTREAM"
          echo "Current digest: $CURRENT"
          echo "Force build: $FORCE"

          if [[ "$FORCE" == "true" ]]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "✅ Build triggered: Force build enabled"
          elif [[ -z "$CURRENT" ]]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "✅ Build triggered: First build (no existing image)"
          elif [[ "$UPSTREAM" != "$CURRENT" ]]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "✅ Build triggered: Upstream changed"
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "⏭️ Build skipped: No changes detected"
          fi

  build-and-push:
    needs: check-upstream
    if: needs.check-upstream.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Restore Rust build cache and binaries
        id: rust-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cross
            target
            dist
          key: rust-cross-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ env.CROSS_VERSION }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'src/**') }}
          restore-keys: |
            rust-cross-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ env.CROSS_VERSION }}-

      - name: Check restored license-server binaries
        id: cached-binaries
        run: |
          set -euo pipefail
          if [[ "${{ steps.rust-cache.outputs.cache-hit }}" == "true" && -x dist/license-server-amd64 && -x dist/license-server-arm64 ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Using cached license-server binaries"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cached binaries are missing or not an exact cache hit; rebuilding"
          fi

      - name: Install Rust toolchain
        if: steps.cached-binaries.outputs.ready != 'true'
        run: |
          set -euo pipefail
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
          rustup default "${RUST_TOOLCHAIN}"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install cross
        if: steps.cached-binaries.outputs.ready != 'true'
        run: |
          set -euo pipefail
          if [[ ! -x "$HOME/.cargo/bin/cross" ]]; then
            cargo install cross --version "${CROSS_VERSION}" --locked
          fi
          cross --version

      - name: Build license-server binaries with cross
        if: steps.cached-binaries.outputs.ready != 'true'
        run: |
          set -euo pipefail
          cross build --release --target x86_64-unknown-linux-gnu
          cross build --release --target aarch64-unknown-linux-gnu
          mkdir -p dist
          install -m 0755 target/x86_64-unknown-linux-gnu/release/license-server dist/license-server-amd64
          install -m 0755 target/aarch64-unknown-linux-gnu/release/license-server dist/license-server-arm64
          ls -lh dist/

      - name: Save Rust build cache and binaries
        if: steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cross
            target
            dist
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=sync-{{date 'YYYY-MM-DD'}}
            type=schedule,pattern={{date 'YYYY-MM'}}
            type=raw,value=manual-{{sha}},enable={{is_default_branch}},event=workflow_dispatch
          labels: |
            org.opencontainers.image.title=RustDesk Server Pro License Server
            org.opencontainers.image.description=Modified RustDesk Server Pro with custom license server
            upstream.image=${{ env.UPSTREAM_IMAGE }}
            upstream.digest=${{ needs.check-upstream.outputs.upstream_digest }}
            upstream.sync.date={{date 'iso8601'}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.ci
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          no-cache: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            UPSTREAM_REF=${{ env.UPSTREAM_IMAGE }}@${{ needs.check-upstream.outputs.upstream_digest }}
            UPSTREAM_IMAGE=${{ env.UPSTREAM_IMAGE }}
            UPSTREAM_DIGEST=${{ needs.check-upstream.outputs.upstream_digest }}

      - name: Generate artifact attestation
        if: success()
        continue-on-error: true
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  notify-result:
    needs: [check-upstream, build-and-push]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Create summary
        run: |
          echo "## Upstream Sync Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Upstream Image | \`${{ env.UPSTREAM_IMAGE }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Upstream Digest | \`${{ needs.check-upstream.outputs.upstream_digest }}\` |" >> $GITHUB_STEP_SUMMARY

          PREV_DIGEST="${{ needs.check-upstream.outputs.current_digest }}"
          if [[ -z "$PREV_DIGEST" ]]; then
            echo "| Previous Digest | \`<none>\` (first build) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Previous Digest | \`$PREV_DIGEST\` |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "| Should Build | ${{ needs.check-upstream.outputs.should_build }} |" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.check-upstream.outputs.should_build }}" == "true" ]]; then
            if [[ "${{ needs.build-and-push.result }}" == "success" ]]; then
              echo "| Build Status | ✅ Success |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| Build Status | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "| Build Status | ⏭️ Skipped (no changes) |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          NEXT_RUN=$(date -u -d 'next month' '+%Y-%m-01 02:00 UTC' 2>/dev/null || date -u -v+1m '+%Y-%m-01 02:00 UTC' 2>/dev/null || echo "Next month, 1st day at 02:00 UTC")
          echo "**Next scheduled run**: $NEXT_RUN" >> $GITHUB_STEP_SUMMARY
