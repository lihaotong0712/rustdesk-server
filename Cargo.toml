[package]
name = "license-server"
version = "0.1.0"
edition = "2024"

[dependencies]
sodiumoxide = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22.1"
actix-web = { version = "4", features = ["rustls-0_21"] }
rustls = "0.21"
rustls-pemfile = "1"
rcgen = "0.10"
log = "0.4"
env_logger = "0.10"
